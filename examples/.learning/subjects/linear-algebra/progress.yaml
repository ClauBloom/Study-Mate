misconceptions:
  - topic: 线性相关与解的存在性
    question: "第 1 课练习里的方程组有两列成比例，那样本不是应该有无穷多解吗？"
    misunderstanding: "把「列向量线性相关」当成了「有无穷多解」的充分条件，忽略了右端项是不是落在列向量的张成里"
    answer_summary: "相关只说明「拼法不唯一」，能拼出来才有无穷多解；拼不出来照样无解。两步要分开做：先看 b 在不在张成里，再看拼法是否唯一。"
    follow_up: "固定 A 的列为 (1,2) 与 (2,4)，把 b 分别取 (3,6) 与 (3,7) 各算一次，说出两次的结论差在哪一步"
    importance: high
  - topic: 零空间维数
    question: "A = [[1,2],[2,4]] 有两行，那零空间的维数不是 2 吗？"
    misunderstanding: "秩-零化度定理里的「维数」记成了矩阵的行数，实际上应是列数（列数就是未知量个数，也就是输入空间的维数）"
    answer_summary: "用列数：列数 2 − 秩 1 = 零空间维数 1；解 x + 2y = 0 得到 (x, y) = t·(−2, 1)，是一条过原点的直线，维数确实是 1。"
    follow_up: "换成 3 列的矩阵 [[1,2,3],[2,4,6]] 重算一遍零空间维数，并写出两个基向量"
    importance: high
