nodes:
  - id: http.basics
    title: HTTP 基础
    kind: 实操
    objective: "能解释 HTTP 请求/响应结构与常见状态码，并用 curl 实测"
    problem: "浏览器和服务器之间怎么对话"
    prerequisites: []
    concepts: [请求行, 状态码, 请求头]
    resources:
      - title: MDN HTTP 概览
        url: https://developer.mozilla.org/zh-CN/docs/Web/HTTP/Overview
        type: official-doc
    practice: "用 curl 请求一个公开 API，观察状态码与响应头"
    pitfalls: [把状态码背成数字, 混淆请求头与响应头]
    realworld: "浏览器开发者工具 Network 面板里的每一条请求"
    过关标准: ["能说清一次 404 的完整过程", "curl -v 输出解释正确"]
    status: 未开始
    mastery: 0
  - id: http.routing
    title: 路由
    kind: 实操
    objective: "能独立设计并实现 REST 路由"
    problem: "请求怎么找到对应的处理函数"
    prerequisites: [http.basics]
    concepts: [路由表, 路径参数, 方法分派]
    resources:
      - title: Express 官方路由指南
        url: https://expressjs.com/en/guide/routing.html
        type: official-doc
    practice: "为订单 API 加 3 条路由（GET/POST/DELETE）"
    pitfalls: [路径参数与查询参数混淆, 路由顺序影响匹配]
    realworld: "网关 → 服务 → 处理函数的转发链"
    过关标准: ["手写路由表并解释匹配顺序", "为路由写测试并运行通过"]
    status: 未开始
    mastery: 0
  - id: exp.crud-routes
    title: "实验一：把订单 CRUD 跑起来"
    kind: 实验
    objective: "用已学的 HTTP 与路由，把三条 CRUD 路由跑通并亲手验收"
    problem: "学了三课，合起来到底能不能做出一个能用的接口"
    prerequisites: [http.basics, http.routing]
    practice: "按实验说明页做出三条 CRUD 路由，用 curl 逐条验收，最后跑一遍自检"
    过关标准:
      - "三条路由用 curl 都能打通（列表 / 新建 / 删除）"
      - "讲得清每条请求落到哪个处理函数、命中顺序为什么是这样"
    status: 未开始
    mastery: 0
  - id: http.validation
    title: 参数校验
    kind: 实操
    objective: "能对路径参数、查询参数与请求体做显式校验，并让非法输入返回明确错误"
    problem: "客户端送来的数据不可信——脏数据怎么挡在业务逻辑之外"
    prerequisites: [http.routing]
    concepts: [请求体解析, 校验边界, 校验失败的状态码]
    resources:
      - title: MDN HTTP 状态码 · 4xx 客户端错误
        url: https://developer.mozilla.org/zh-CN/docs/Web/HTTP/Status#client_error_responses
        type: official-doc
    practice: "给订单创建接口加参数校验，用 curl 发三种非法请求看返回"
    pitfalls: [把校验散落在业务逻辑里, 校验失败返回 500 而不是 400]
    realworld: "表单提交、第三方回调里的字段清洗"
    过关标准: ["非法请求全部返回 400 且有可读错误信息", "校验代码集中在一处，业务处理函数里没有 if 判空"]
    status: 未开始
    mastery: 0
  - id: http.errors
    title: 错误处理
    kind: 概念
    objective: "能设计统一的错误处理机制，让每类失败都映射到正确的状态码"
    problem: "一个 handler 抛异常，整个进程就挂——错误该在哪里被接住"
    prerequisites: [http.validation]
    concepts: [错误类型, 统一错误中间件, 错误响应格式]
    resources:
      - title: Express 官方错误处理指南
        url: https://expressjs.com/en/guide/error-handling.html
        type: official-doc
    practice: "把项目里散落的 try/catch 收拢成一个错误处理中间件"
    pitfalls: [把堆栈直接返回给客户端, 用 200 携带错误信息]
    realworld: "线上接口出错时的 5xx 日志与告警"
    过关标准: ["抛出自定义错误后客户端收到正确状态码", "错误响应体格式统一"]
    status: 未开始
    mastery: 0
  - id: db.access
    title: 数据库访问
    kind: 实操
    objective: "用参数化查询给订单表做增删改查，并连上 PostgreSQL"
    problem: "数据要活过进程重启——代码怎么跟数据库说话"
    prerequisites: [http.errors]
    concepts: [连接池, 参数化查询, 行到对象的类型映射]
    resources:
      - title: node-postgres 官方文档
        url: https://node-postgres.com/
        type: official-doc
      - title: PostgreSQL 官方教程
        url: https://www.postgresql.org/docs/current/tutorial.html
        type: official-doc
    practice: "为订单表写 CRUD，含按状态过滤的查询"
    pitfalls: [字符串拼接 SQL 造成注入, 在请求里新建连接而不复用池]
    realworld: "订单、用户表在服务端的读写"
    过关标准: ["能用 psql 看到代码写入的那一行", "查询全部走参数化写法"]
    status: 未开始
    mastery: 0
  - id: exp.pg-and-tests
    title: "实验二：接上数据库并写测试"
    kind: 实验
    objective: "把数据落进 PostgreSQL，并写一组一条命令跑完的测试"
    problem: "数据只活在内存里，重启就没了；接口改一行就不敢动"
    prerequisites: [http.validation, db.access, test.api]
    practice: "为订单表接上真实数据库读写，补一组覆盖失败路径的测试，再跑一遍自检"
    过关标准:
      - "重启服务后数据还在（能用 psql 看到代码写进去的那一行）"
      - "一条命令跑完所有测试；故意改坏一处实现会有测试报红"
    status: 未开始
    mastery: 0
  - id: auth.basics
    title: 认证与授权
    kind: 实操
    objective: "能实现注册/登录、签发与校验凭证、按用户隔离资源"
    problem: "别人凭什么相信你就是你——接口怎么知道该给谁数据"
    prerequisites: [db.access]
    concepts: [密码哈希, JWT, 认证中间件, 资源归属校验]
    resources:
      - title: MDN HTTP 认证
        url: https://developer.mozilla.org/zh-CN/docs/Web/HTTP/Authentication
        type: official-doc
      - title: JWT 官方介绍
        url: https://jwt.io/introduction
        type: official-doc
    practice: "给订单接口加登录校验，让用户只能看到自己的订单"
    pitfalls: [明文存密码, 拿用户 id 当唯一凭证而不校验归属]
    realworld: "任何带登录的应用：凭证过期、越权访问的排错"
    过关标准: ["未带凭证的请求被 401 拦下", "改请求里的 id 拿不到别人的数据"]
    status: 未开始
    mastery: 0
  - id: test.api
    title: 接口测试
    kind: 实操
    objective: "能用自动化测试覆盖每条路由，并让测试可重复运行"
    problem: "改一处代码就怕弄坏别处——怎么让改动有底气"
    prerequisites: [auth.basics]
    concepts: [测试夹具, 断言, 测试数据库隔离]
    resources:
      - title: Node.js 官方测试运行器文档
        url: https://nodejs.org/api/test.html
        type: official-doc
    practice: "给订单 API 的每个端点写测试，含一个失败路径"
    pitfalls: [测试之间共享数据导致顺序依赖, 只测成功路径]
    realworld: "重构之前先跑一遍测试套件"
    过关标准: ["一次命令跑完所有测试", "故意改坏一处实现，有测试报红"]
    status: 未开始
    mastery: 0
  - id: project.deploy
    title: 完整项目与部署
    kind: 实操
    objective: "能把订单 API 部署到公网，用环境变量管理配置，并跑通一次真实访问"
    problem: "代码在你机器上跑得好好的——怎么让别人也用得上"
    prerequisites: [test.api]
    concepts: [环境变量, 进程管理, 健康检查, 数据库迁移]
    resources:
      - title: The Twelve-Factor App（中文版）
        url: https://12factor.net/zh_cn/
        type: official-doc
      - title: Node.js 官方部署指南
        url: https://nodejs.org/en/learn/getting-started/how-to-install-nodejs
        type: official-doc
    practice: "把订单 API 部到一台云主机上并用公网地址访问"
    pitfalls: [把连接串硬编码进代码, 部署后没有健康检查就以为服务在跑]
    realworld: "第一次让自己的接口被真实用户调用"
    过关标准: ["公网地址上能注册、登录、完成一次 CRUD", "服务重启后数据仍在"]
    status: 未开始
    mastery: 0
  - id: exp.auth-deploy
    title: "实验三：加认证并部署上线"
    kind: 实验
    objective: "给订单接口加上登录校验并部署到公网，让真实地址能走完一次完整流程"
    problem: "本地能跑不等于别人能用；接口裸奔着，谁都能删别人的订单"
    prerequisites: [auth.basics, project.deploy]
    practice: "加认证中间件、部署到一台云主机，用公网地址走一遍注册 / 登录 / 下单"
    过关标准:
      - "未带凭证的请求被 401 拦下；改请求里的 id 拿不到别人的数据"
      - "公网地址上能完成一次完整流程，服务重启后数据仍在"
    status: 未开始
    mastery: 0
edges:
  - from: http.basics
    to: http.routing
    reason: "理解 HTTP 方法与路径后才能设计路由"
  - from: http.routing
    to: http.validation
    reason: "先有能接住请求的路由，才谈得上校验它收到的参数"
  - from: http.validation
    to: http.errors
    reason: "校验失败是最常见的错误路径，先有校验才需要统一的错误出口"
  - from: http.errors
    to: db.access
    reason: "数据库操作随时会失败，先有错误处理才不会让异常掀翻进程"
  - from: db.access
    to: auth.basics
    reason: "用户与凭证要先存得下来，认证才有依据"
  - from: auth.basics
    to: test.api
    reason: "认证让接口有了多条分支与权限组合，正是测试要覆盖的对象"
  - from: test.api
    to: project.deploy
    reason: "有测试兜底之后，部署与后续改动才敢做"
  - from: http.basics
    to: http.errors
    reason: "不懂状态码就设计不出正确的错误映射"
  - from: http.routing
    to: auth.basics
    reason: "认证是挂在路由上的一道关卡，要先会写路由与中间件"
  - from: http.basics
    to: exp.crud-routes
    reason: "实验一验收 HTTP 基础"
  - from: http.routing
    to: exp.crud-routes
    reason: "实验一验收路由"
  - from: http.validation
    to: exp.pg-and-tests
    reason: "实验二验收参数校验"
  - from: db.access
    to: exp.pg-and-tests
    reason: "实验二验收数据库读写"
  - from: test.api
    to: exp.pg-and-tests
    reason: "实验二验收接口测试"
  - from: auth.basics
    to: exp.auth-deploy
    reason: "实验三验收认证"
  - from: project.deploy
    to: exp.auth-deploy
    reason: "实验三验收部署"
