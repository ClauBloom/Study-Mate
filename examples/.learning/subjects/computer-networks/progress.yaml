misconceptions:
  - topic: 子网掩码
    question: "192.168.1.70/26 的广播地址为什么是 .127，而不是 .255？"
    misunderstanding: "把前缀长度 /26 当成「第 26 号网段」，以为块大小是 26；看不出 .70 落在 .64 那一段里"
    answer_summary: "/26 是网络号的位数，主机位剩 6 位，块大小是 2^6 = 64；.64 到 .127 是一个网段，.127 的主机位全 1，是它的广播地址"
    follow_up: "用 lab 的 parse_cidr 把 192.168.1.70/26 与 /25 各算一遍，对比网络地址与广播地址怎么变"
    importance: high
  - topic: MAC 地址
    question: "跨网段 ping 服务器时，抓到的帧里目的 MAC 为什么不是服务器的网卡地址？"
    misunderstanding: "以为 MAC 地址和 IP 地址一样端到端有效，整条路都用同一个目的 MAC"
    answer_summary: "MAC 只在同一段链路里有意义；每经过一台路由器，帧头就换成「当前这台机器 → 下一跳」的地址，IP 包本身基本不动"
    follow_up: "按课件图 5 把两跳的帧头各写一遍，再在抓包里核对第一跳的目的 MAC 是不是网关"
    importance: medium
  - topic: 封装
    question: "抓包时每一层都有一段地址，为什么要一层层重复写？"
    misunderstanding: "以为各层首部是重复信息，删掉一层也不影响；没意识到每层只读自己那一段、服务不同的范围"
    answer_summary: "首部不是重复：MAC 地址管这一段链路、IP 地址管端到端、端口管哪个程序。范围不同，缺一层就有一段路走不动"
    follow_up: "把课件图 1 的四行自己画一遍，每行旁边标出「这一段地址管多远」"
    importance: medium
